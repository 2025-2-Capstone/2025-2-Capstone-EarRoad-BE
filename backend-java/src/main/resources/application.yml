spring:
  datasource:
    url: jdbc:mysql://localhost:3306/app?serverTimezone=Asia/Seoul&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update          # 초기에만 사용, 곧 Flyway로 전환 권장
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  address: 127.0.0.1


app:
  py:
    base-url: http://127.0.0.1:8000   # 파이썬 FastAPI 로컬
