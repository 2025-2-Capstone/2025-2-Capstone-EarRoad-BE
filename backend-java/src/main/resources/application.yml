spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update          # 초기에만 사용, 이후 Flyway로 전환
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  address: 127.0.0.1
